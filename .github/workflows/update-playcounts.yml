name: Update audiobook play counts

on:
  schedule:
    # 23:00 UTC = 07:00 China time (UTC+8) every day
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-playcounts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest play counts and update data.json
        run: python scripts/update_playcounts.py

      - name: Commit and push if data.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No changes to commit."
          else
            git add data.json
            git commit -m "Auto-update play counts ($(date -u +%Y-%m-%d))"
            git push
          fi
